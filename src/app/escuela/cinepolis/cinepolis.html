
<div class="max-w-2xl mx-auto mt-10 p-6 bg-white border border-gray-200 rounded-lg shadow-sm">

  <h3 class="text-2xl font-bold text-center text-gray-900 mb-6">
    Cinépolis
  </h3>

  <form [formGroup]="formulario">
    <div class="mb-5">
      <label for="nombre" class="block mb-2 text-sm font-medium text-gray-900">
        Nombre del comprador
      </label>
      <input
        id="nombre"
        type="text"
        formControlName="nombre"
        class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg block w-full p-2.5"
      >
    </div>

    <div class="mb-5">
      <label for="cantidadPersonas" class="block mb-2 text-sm font-medium text-gray-900">
        Cantidad de compradores
      </label>
      <input
        id="cantidadPersonas"
        type="number"
        formControlName="cantidadPersonas"
        min="1"
        class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg block w-full p-2.5"
      >
    </div>

    <div class="mb-5">
      <label for="boletos" class="block mb-2 text-sm font-medium text-gray-900">
        Cantidad de boletos
      </label>
      <input
        id="boletos"
        type="number"
        formControlName="boletos"
        min="1"
        class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg block w-full p-2.5"
      >
    </div>

    <div class="mb-5">
      <span class="block mb-2 text-sm font-medium text-gray-900">
        ¿Cuenta con tarjeta Cinépolis?
      </span>

      <div class="flex items-center mb-2">
        <input
          id="tarjetaSi"
          type="radio"
          formControlName="tarjeta"
          value="si"
          class="w-4 h-4 text-blue-600 bg-gray-100 border-gray-300"
        >
        <label for="tarjetaSi" class="ms-2 text-sm font-medium text-gray-900">
          Sí
        </label>
      </div>

      <div class="flex items-center">
        <input
          id="tarjetaNo"
          type="radio"
          formControlName="tarjeta"
          value="no"
          class="w-4 h-4 text-blue-600 bg-gray-100 border-gray-300"
        >
        <label for="tarjetaNo" class="ms-2 text-sm font-medium text-gray-900">
          No
        </label>
      </div>
    </div>
  </form>

  <h4 class="text-lg font-semibold text-gray-900 mt-6 mb-3">
    Acciones
  </h4>

  <div class="flex gap-3">
    <button
      type="button"
      (click)="calcular()"
      class="text-white bg-blue-700 hover:bg-blue-800 font-medium rounded-lg text-sm px-5 py-2.5"
    >
      Procesar
    </button>

    <button
      type="button"
      (click)="salir()"
      class="text-white bg-red-700 hover:bg-red-800 font-medium rounded-lg text-sm px-5 py-2.5"
    >
      Salir
    </button>
  </div>

  <h4 class="text-lg font-semibold text-gray-900 mt-6 mb-3">
    Salidas
  </h4>

  <div *ngIf="mensaje" class="mb-4">
    <label for="mensaje" class="block mb-2 text-sm font-medium text-gray-900">
      Mensaje
    </label>
    <textarea
      id="mensaje"
      [value]="mensaje"
      readonly
      rows="2"
      class="block p-2.5 w-full text-sm text-gray-900 bg-gray-50 rounded-lg border border-gray-300"
    ></textarea>
  </div>

  <div *ngIf="descuento > 0" class="mb-3">
    <label for="descuento" class="block mb-2 text-sm font-medium text-gray-900">
      Descuento aplicado
    </label>
    <input
      id="descuento"
      type="text"
      [value]="'$' + descuento.toFixed(2)"
      readonly
      class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg block w-full p-2.5"
    >
  </div>
</div>
