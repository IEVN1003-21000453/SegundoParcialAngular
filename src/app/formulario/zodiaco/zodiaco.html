<div class="w-full max-w-5xl mx-auto">
  <div class="bg-white border border-gray-300 rounded-lg shadow-lg overflow-hidden">
    <div class="grid grid-cols-1 md:grid-cols-2">
      <div class="p-8">
        <h2 class="text-2xl font-bold text-center text-gray-800 mb-8">
          Datos Personales
        </h2>
        <div class="mb-5">
          <label class="block mb-2 text-sm font-medium text-gray-900">
            Nombre
          </label>
          <input
            type="text"
            [(ngModel)]="nombre"
            placeholder="Ingresa tu nombre"
            class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg block w-full p-2.5">
        </div>
        <div class="mb-5">
          <label class="block mb-2 text-sm font-medium text-gray-900">
            Apellido Paterno
          </label>
          <input
            type="text"
            [(ngModel)]="apellidoPaterno"
            placeholder="Ingresa tu apellido paterno"
            class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg block w-full p-2.5">
        </div>
        <div class="mb-5">
          <label class="block mb-2 text-sm font-medium text-gray-900">
            Apellido Materno
          </label>
          <input
            type="text"
            [(ngModel)]="apellidoMaterno"
            placeholder="Ingresa tu apellido materno"
            class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg block w-full p-2.5">
        </div>
        <div class="mb-5">
          <label class="block mb-3 text-sm font-medium text-gray-900">
            Fecha de nacimiento
          </label>
          <div class="grid grid-cols-3 gap-3">
            <div>
              <label class="block mb-2 text-xs text-gray-600">
                Día
              </label>
              <input
                type="number"
                [(ngModel)]="diaNacimiento"
                min="1"
                max="31"
                placeholder="22"
                class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg block w-full p-2.5">
            </div>
            <div>
              <label class="block mb-2 text-xs text-gray-600">
                Mes
              </label>
              <input
                type="number"
                [(ngModel)]="mesNacimiento"
                min="1"
                max="12"
                placeholder="02"
                class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg block w-full p-2.5">
            </div>
            <div>
              <label class="block mb-2 text-xs text-gray-600">
                Año
              </label>
              <input
                type="number"
                [(ngModel)]="anioNacimiento"
                placeholder="1990"
                class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg block w-full p-2.5">
            </div>
          </div>
        </div>
        <div class="mb-6">
          <label class="block mb-3 text-sm font-medium text-gray-900">
            Sexo
          </label>
          <div class="flex gap-6">
            <div class="flex items-center">
              <input
                type="radio"
                name="sexo"
                value="Masculino"
                [(ngModel)]="sexo"
                class="w-4 h-4">
              <span class="ms-2 text-sm font-medium text-gray-900">
                Masculino
              </span>
            </div>
            <div class="flex items-center">
              <input
                type="radio"
                name="sexo"
                value="Femenino"
                [(ngModel)]="sexo"
                class="w-4 h-4">
              <span class="ms-2 text-sm font-medium text-gray-900">
                Femenino
              </span>
            </div>
          </div>
        </div>
        <button
          type="button"
          (click)="calcularZodiaco()"
          class="w-full text-white bg-blue-700 hover:bg-blue-800 font-medium rounded-lg text-sm px-5 py-2.5 text-center">
          Imprimir
        </button>
      </div>
      <div class="bg-gray-50 border-t md:border-t-0 md:border-l border-gray-300 p-8 flex items-center justify-center">
        <div
          [hidden]="!mostrarResultado"
          class="text-center w-full">
          <h2 class="text-2xl font-bold text-gray-800 mb-8">
            Resultado
          </h2>
          <div class="mb-5">
            <p class="text-sm text-gray-500">
              Nombre completo
            </p>
            <p class="text-lg font-semibold text-gray-800">
              {{ nombre }} {{ apellidoPaterno }} {{ apellidoMaterno }}
            </p>
          </div>
          <div class="mb-5">
            <p class="text-sm text-gray-500">
              Sexo
            </p>
            <p class="text-lg font-semibold text-gray-800">
              {{ sexo }}
            </p>
          </div>
          <div class="mb-5">
            <p class="text-sm text-gray-500">
              Edad
            </p>
            <p class="text-lg font-semibold text-gray-800">
              {{ edad }} años
            </p>
          </div>
          <div class="mb-4">
            <p class="text-sm text-gray-500 mb-2">
              Signo Zodiacal
            </p>
            <p class="text-2xl font-bold text-blue-700 capitalize">
              {{ signoZodiacal }}
            </p>
          </div>
          <img
            [src]="imagenSigno"
            [alt]="signoZodiacal"
            class="w-40 h-40 object-contain mx-auto mt-4 rounded-lg">
        </div>
        <div
          [hidden]="mostrarResultado"
          class="text-center">
          <p class="text-gray-500 text-lg">
            Ingresa tus datos
          </p>
          <p class="font-semibold text-gray-700">
            y presiona "Imprimir"
          </p>
        </div>
      </div>
    </div>
  </div>
</div>
